services:
  - type: web
    name: whitematrix-grievance-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py createcachetable
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_MEDIA_ROOT
        value: /tmp/whitematrix-media
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: TRUST_PROXY_SSL_HEADER
        value: "True"
      - key: API_NUM_PROXIES
        value: "1"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
